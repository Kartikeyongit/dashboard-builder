# Render Blueprint: one-click free deployment.
# Docs: https://render.com/docs/blueprint-spec
#
# Creates:
#   - dashboard-builder-api: Docker web service (Go/Fiber) from backend/
#   - dashboard-builder-web: static site (React/Vite) from frontend/
#
# Redis is intentionally absent. The backend runs in single-instance mode with
# in-process pub/sub and an in-process scheduler lock, which is all the free
# Render tier needs. Add REDIS_URL only if you later run multiple instances.
#
# Before syncing, have a Neon connection string ready. Render prompts for
# DB_URL, JWT_SECRET, and ENCRYPTION_KEY (sync: false) during setup.

services:
  - type: web
    name: dashboard-builder-api
    runtime: docker
    plan: free
    rootDir: backend
    # Relative to rootDir, so this is backend/Dockerfile.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      # Match the port the Docker image exposes and the app listens on.
      - key: PORT
        value: "8080"
      # Public URL of the static site, used for CORS and share links.
      # RENDER_EXTERNAL_URL is a built-in Render variable, so this stays
      # correct even if the service is renamed.
      - key: FRONTEND_URL
        fromService:
          type: web
          name: dashboard-builder-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: dashboard-builder-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Origin only; the frontend appends /api/v1 automatically.
      - key: VITE_API_URL
        fromService:
          type: web
          name: dashboard-builder-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      # Client-side routing (React Router).
      - type: rewrite
        source: /*
        destination: /index.html
