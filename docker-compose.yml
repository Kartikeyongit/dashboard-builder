services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dashboard_dev_password
      POSTGRES_DB: dashboard_builder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    # Optional: only needed for multi-instance mode.
    # Start with: docker compose --profile redis up -d
    profiles: ["redis"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  pgdata: