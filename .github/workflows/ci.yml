name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dashboard_builder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          for f in internal/db/migrations/*.up.sql; do
            psql -h localhost -U postgres -d dashboard_builder_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Integration tests
        env:
          TEST_DB_URL: postgres://postgres:postgres@localhost:5432/dashboard_builder_test?sslmode=disable
        run: go test -tags=integration ./internal/datasource ./internal/repository

      - name: Build
        run: go build ./...

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Performance budget
        run: npm run budget

  e2e:
    name: E2E (Cypress)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dashboard_builder_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: postgres://postgres:postgres@localhost:5432/dashboard_builder_e2e?sslmode=disable
      JWT_SECRET: 'ci-e2e-jwt-secret-that-is-at-least-32-chars'
      # Quote this and keep letters in it: an all-digit value such as
      # 0000...0001 can be parsed as a number, which mangles the key.
      ENCRYPTION_KEY: 'a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90'
      REDIS_URL: ''
      PORT: '8099'
      # Must match the origin the preview server is served from, because CORS
      # allows this exact origin only.
      FRONTEND_URL: http://127.0.0.1:4173
      # The whole Cypress suite signs in from 127.0.0.1 many times per minute.
      AUTH_RATE_LIMIT_MAX: '100'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start API
        working-directory: backend
        env:
          MIGRATIONS_DIR: internal/db/migrations
        run: |
          go build -o /tmp/dashboard-api ./cmd/api
          nohup /tmp/dashboard-api > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8099/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "API did not become healthy"; cat /tmp/api.log; exit 1

      # The API applies its own migrations on boot (tracked in
      # schema_migrations), so seeding runs after it is up. Applying the SQL
      # files separately would leave them untracked and the API would try to
      # create the same tables again.
      - name: Seed demo data
        working-directory: backend
        run: go run ./cmd/seed

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Cypress binary
        working-directory: frontend
        run: npx cypress install

      - name: Build frontend against the local API
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:8099/api/v1
        run: npm run build

      - name: Start preview server
        working-directory: frontend
        run: |
          # Bind to IPv4 explicitly: the default "localhost" host can resolve to
          # ::1 only, which the 127.0.0.1 health check below would never reach.
          nohup npm run preview -- --port 4173 --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Preview server did not start"; cat /tmp/preview.log; exit 1

      - name: Run Cypress
        working-directory: frontend
        shell: bash
        env:
          CYPRESS_apiUrl: http://127.0.0.1:8099/api/v1
        run: |
          # Without pipefail the pipeline would report tee's exit code and a
          # failing Cypress run would look green.
          set -o pipefail
          npx cypress run --spec 'cypress/e2e/*.cy.ts' 2>&1 | tee /tmp/cypress.log

      # On the first run for a platform this records baselines instead of
      # failing. Commit cypress/visual-baseline/linux/ from the uploaded
      # artifact to turn the check into a gate for CI.
      - name: Visual regression
        if: success()
        working-directory: frontend
        run: npm run visual:check

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-visual-${{ github.run_attempt }}
          path: |
            frontend/cypress/screenshots/visual.cy.ts
            frontend/cypress/visual-diff
            frontend/cypress/visual-baseline
          if-no-files-found: ignore
          retention-days: 7

      # Surface the failing assertion in the check run even when logs are not
      # available, so a red build still says what broke. Context lines are
      # included because Cypress splits the spec name, error, and stack across
      # several lines.
      - name: Cypress failure summary
        if: failure()
        working-directory: frontend
        run: |
          if [ -f /tmp/cypress.log ]; then
            grep -nE -A 12 "failing$|CypressError|AssertionError|Timed out|Error: " /tmp/cypress.log \
              | head -120 \
              | while IFS= read -r line; do
                  echo "::error title=Cypress failure::$line"
                done
            {
              echo '### Cypress failures'
              echo '```'
              grep -nE -A 20 "failing$|CypressError|AssertionError|Timed out|Error: " /tmp/cypress.log | head -160
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: API logs
        if: failure()
        run: cat /tmp/api.log || true

      - name: Preview logs
        if: failure()
        run: cat /tmp/preview.log || true
